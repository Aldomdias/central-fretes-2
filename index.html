<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Central de Fretes" />
    <title>AMD LOG | Central de Fretes</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Recupera automaticamente uma instalação PWA que ficou apontando para
      // assets versionados removidos por um deploy mais recente. Precisa rodar
      // antes do módulo principal, pois esse módulo pode ser justamente o
      // arquivo que não foi encontrado.
      (() => {
        const CHAVE_RECUPERACAO = 'amd-pwa-recovery-attempted';
        let recuperando = false;

        async function recuperarPwa() {
          if (recuperando || sessionStorage.getItem(CHAVE_RECUPERACAO)) return;
          recuperando = true;
          sessionStorage.setItem(CHAVE_RECUPERACAO, '1');

          try {
            const registros = 'serviceWorker' in navigator
              ? await navigator.serviceWorker.getRegistrations()
              : [];
            await Promise.all(registros.map((registro) => registro.unregister()));

            if ('caches' in window) {
              const nomes = await caches.keys();
              await Promise.all(nomes.map((nome) => caches.delete(nome)));
            }
          } finally {
            const url = new URL(window.location.href);
            url.searchParams.set('_atualizar', Date.now().toString());
            window.location.replace(url.toString());
          }
        }

        window.addEventListener('error', (evento) => {
          const origem = evento.target?.src || evento.filename || '';
          if (origem.includes('/assets/') || /Loading module|dynamically imported module/i.test(evento.message || '')) {
            recuperarPwa();
          }
        }, true);

        window.addEventListener('unhandledrejection', (evento) => {
          const mensagem = String(evento.reason?.message || evento.reason || '');
          if (/ChunkLoadError|Loading chunk|dynamically imported module|Failed to fetch/i.test(mensagem)) {
            recuperarPwa();
          }
        });

        window.addEventListener('load', () => {
          if (document.getElementById('root')?.childElementCount) {
            sessionStorage.removeItem(CHAVE_RECUPERACAO);
          }
        });
      })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
